name: Run Newman API Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Build the Docker image from the Dockerfile
      - name: Build Docker image
        run: docker build -t api-tests .

      # Run Newman tests inside the Docker container
      - name: Run Newman tests
        run: |
          docker run --rm \
            -e "githubToken=${{ secrets.PAT_TOKEN }}" \
            -e "owner=${{ secrets.REPO_OWNER }}" \
            -v ${{ github.workspace }}/reports:/app/reports \
            api-tests

      # Upload the reports even if tests fail
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: reports/