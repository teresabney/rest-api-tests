name: Run Newman API Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Newman globally so we can run Postman collections from the CLI
      - name: Install Newman
        run: npm install -g newman

      # htmlextra generates a styled HTML report - more readable than JUnit XML
      - name: Install Newman HTML reporter
        run: npm install -g newman-reporter-htmlextra

      # Run the Postman collection api tests and generate junit and html reports
      - name: Run Newman tests
        run: |
          newman run "collections/QA-Portfolio-Project.postman_collection.json" \
            -e "environments/QA-Portfolio-Project.postman_environment.json" \
            --env-var "githubToken=${{ secrets.PAT_TOKEN }}" \
            --env-var "owner=${{ secrets.REPO_OWNER }}" \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export reports/results.xml \
            --reporter-htmlextra-export reports/report.html

      # Upload the reports even if tests fail
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: reports/
